<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCE-HQ Trace Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid #30363d;
            color: #58a6ff;
        }

        .request-item {
            padding: 15px 20px;
            border-bottom: 1px solid #30363d;
            cursor: pointer;
            transition: background 0.2s;
        }

        .request-item:hover {
            background: #21262d;
        }

        .request-item.active {
            background: #1f6feb;
            color: white;
        }

        .request-id {
            font-size: 14px;
            font-family: monospace;
            margin-bottom: 5px;
        }

        .request-time {
            font-size: 12px;
            color: #8b949e;
        }
        
        .request-item.active .request-time {
            color: #d2e4ff;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .trace-header {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #c9d1d9;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .timeline-card {
            background: rgba(33, 38, 45, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            position: relative;
        }

        .timeline-card::before {
            content: '';
            position: absolute;
            top: 20px;
            left: -31px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #58a6ff;
            border: 2px solid #0d1117;
        }
        
        .timeline-card.type-command::before { background: #238636; }
        .timeline-card.type-token::before { background: #d29922; }

        .timeline::before {
            content: '';
            position: absolute;
            left: 65px;
            top: 100px;
            bottom: 40px;
            width: 2px;
            background: #30363d;
            z-index: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #8b949e;
        }

        .agent-badge {
            background: #1f6feb;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }

        .agent-badge.router { background: #8957e5; }
        .agent-badge.security_review { background: #da3633; }
        .agent-badge.os_engineer { background: #238636; }
        .agent-badge.cloud_engineer { background: #d29922; }

        .card-body {
            font-size: 14px;
            line-height: 1.6;
        }

        pre {
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            overflow-x: auto;
            color: #e6edf3;
            margin: 10px 0;
        }

        .command-tag {
            font-family: monospace;
            background: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            Recent Requests
            <div style="margin-top: 10px; font-size: 12px; font-weight: 400;">
                <label for="tenantInput">Tenant ID:</label>
                <input type="text" id="tenantInput" value="default" style="width: 100%; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; padding: 5px; border-radius: 4px; margin-top: 5px;" onchange="fetchRequests()">
            </div>
        </div>
        <!-- Request items will be injected here -->
        <div id="requestList"></div>
    </div>

    <div class="main-content">
        <div class="trace-header" id="trace-header">Select a request to view trace</div>
        <div class="timeline" id="timeline">
            <!-- Trace cards will be injected here -->
        </div>
    </div>

    <script src="trace.js?v=2.8"></script>
</body>
</html>
